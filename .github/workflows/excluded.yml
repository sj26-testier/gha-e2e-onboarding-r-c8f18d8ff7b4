{
  "name": "Shadow excluded",
  "on": {
    "push": {
      "branches": [
        "never"
      ],
      "paths": [
        "src/**"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "probe": {
      "name": "excluded",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 2,
      "steps": [
        {
          "name": "Immutable execution marker",
          "env": {
            "EVENT": "${{ github.event_name }}",
            "SHA": "${{ github.sha }}",
            "WORKFLOW_SHA": "${{ github.workflow_sha }}",
            "REF": "${{ github.ref }}"
          },
          "run": "printf 'SHADOW_PROBE|excluded|%s|%s|%s|%s\\n' \"$EVENT\" \"$SHA\" \"$WORKFLOW_SHA\" \"$REF\""
        }
      ]
    }
  }
}
